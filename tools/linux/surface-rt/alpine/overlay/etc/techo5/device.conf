# Microsoft Surface RT (Tegra 3) on the surface_rt project's mainline kernel. Sourced by
# etc/techo5/boot.sh, etc/techo5/srt-early.sh and the srt-* scripts.
#
# No initramfs and no slot store: systemd-boot (behind srt-wdt.efi) boots a slot's kernel from the
# ESP, the kernel mounts that slot's partition as / (root=PARTUUID=..., read-write) and runs busybox
# init. The slots are eMMC partitions (p2 = A, p3 = B) that the surface_rt project's slotctl owns;
# /data (p4, SRT_DATA) is shared by both, and holds TECHO5's state as on every Show
# (/data/misc/techo5, /data/techo5-linux).
T5_PRODUCT="Surface RT Linux"
T5_BOARD=surface-rt
EMMC=mmcblk0
DATA_DEV=/dev/mmcblk0p4
ESP_DEV=/dev/mmcblk0p1
# No store: boot.sh skips it (not a block device). srt-early.sh writes /run/techo5/slot (the booted
# slot), so boot.sh's slot trial runs on the boot record: bootctl (etc/bootctl.conf) reads
# systemd-boot's entries, which carry ab.slot= as U-Boot's command line does. srt-trial-guard adds the
# early fallback (no gateway in 80 s). The daemon's updater stays off (update.Published).
STORE_DEV=none
# mwifiex_sdio is a module: srt-early.sh loads it, waits for mlan0 and renames it wlan0, which is
# what TECHO5's scripts drive. To boot.sh it is a driver that is already there.
WIFI_MODULE=builtin
WIFI_SDIO_HOST=
# Bluetooth: the 88W8797's UART half, attached by srt-early.sh (btattach, H4 at 3 Mbaud on UARTC)
# once mwifiex has loaded the BT_UART combo firmware; hci0 is then the kernel's like athena's.
BT_MODULE=builtin
# The backlight is up early; the WM8962 card is built in.
HW_WAIT="/sys/class/backlight/backlight/brightness"

# --- Surface RT only (srt-early.sh and friends).
# The PMIC (TPS65911) watchdog, tps65911_wdt: fed by busybox from the first moment of userspace.
SRT_WATCHDOG=/dev/watchdog0
SRT_WATCHDOG_TIMEOUT=100
SRT_WATCHDOG_FEED=30
# A slot on trial must see its gateway within this many seconds of srt-early.sh, or it reboots into
# the good slot (srt-trial-guard).
SRT_TRIAL_NET_WAIT=80
# How long srt-early.sh waits for mwifiex's mlan0 before carrying on (it keeps looking after).
SRT_WIFI_WAIT=40
# Bluetooth over the UART (srt-bluetooth); 0 leaves it off.
SRT_BLUETOOTH=1
SRT_BT_TTY=/dev/ttyTHS1
# zram swap, as postmarketOS had (MB; 0 for none).
SRT_ZRAM_MB=1024
