# mdev (hotplug, set up by etc/techo5/srt-early.sh): load the driver for every device the kernel
# announces (the coldplug pass in srt-early.sh covers the ones already there). kmod's modprobe,
# since the modules are zstd-compressed.
$MODALIAS=.*	root:root 0660 @modprobe -q -b "$MODALIAS"
null	root:root 666
zero	root:root 666
full	root:root 666
random	root:root 666
urandom	root:root 666
tty	root:tty 666
ptmx	root:tty 666
snd/.*	root:audio 660
